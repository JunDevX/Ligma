<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ligma Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>
    <header class="toolbar">
        <div class="tool-group">
            <a href="/home/" class="home-btn" title="Вернуться в библиотеку">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </a>
            <span id="projectTitle" class="project-title">Project</span>
            <span id="saveStatus" class="save-badge">Сохранено</span>
        </div>

        <div class="tool-group center-tools">
            <button class="tool-btn active" id="tool-select" title="Выделение (V)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
            </button>
            <button class="tool-btn" id="tool-rect" title="Прямоугольник (R)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </button>
            <button class="tool-btn" id="tool-circle" title="Окружность (O)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
            </button>
            <button class="tool-btn" id="tool-line" title="Линия (L)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
            </button>
            <button class="tool-btn" id="tool-pencil" title="Рисование (P)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            </button>
            <button class="tool-btn" id="tool-text" title="Текст (T)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            </button>
            <button class="tool-btn" id="tool-image" title="Загрузить изображение (I)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" style="display:none">
        </div>

        <div class="tool-group">
            <div class="zoom-controls">
                <button id="zoomOutBtn" class="btn-icon" title="Отдалить">-</button>
                <span id="zoomLevel">100%</span>
                <button id="zoomInBtn" class="btn-icon" title="Приблизить">+</button>
                <button id="zoomResetBtn" class="btn-icon" title="Сбросить зум">1:1</button>
            </div>
            <button id="deleteBtn" class="btn-icon danger" title="Удалить (Delete)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button id="exportBtn" class="btn-action">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Умный экспорт PNG
            </button>
        </div>
    </header>

    <div class="workspace">
        <aside class="panel left-panel">
            <div class="panel-header">
                <span>Слои</span>
                <span class="hint-text">Зажми и тащи</span>
            </div>
            <ul id="layersList" class="layers-list"></ul>
        </aside>

        <main class="canvas-container" id="canvasWrapper">
            <canvas id="ligmaCanvas"></canvas>

            <div id="dropOverlay" class="drop-overlay hidden">
                <div class="drop-message">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0d99ff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span>Перетащите изображение сюда</span>
                </div>
            </div>

            <div id="contextMenu" class="custom-context-menu hidden">
                <div class="menu-item" id="ctxDuplicate">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span>Дублировать</span>
                    <span class="shortcut">Ctrl+D</span>
                </div>
                <div class="menu-item" id="ctxBringFront">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                    <span>Поднять наверх</span>
                </div>
                <div class="menu-item" id="ctxSendBack">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/></svg>
                    <span>Опустить вниз</span>
                </div>
                <div class="menu-divider"></div>
                <div class="menu-item" id="ctxUploadImg">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span>Вставить картинку</span>
                </div>
                <div class="menu-divider"></div>
                <div class="menu-item danger" id="ctxDelete">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                    <span>Удалить</span>
                    <span class="shortcut">Del</span>
                </div>
            </div>
        </main>

        <aside class="panel right-panel">
            <div class="panel-header">Свойства</div>
            <div id="inspectorContent" class="inspector-body">
                <div class="empty-state">Выберите элемент на холсте</div>
            </div>
        </aside>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
