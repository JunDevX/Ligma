<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ligma - Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#0D99FF"/><path d="M2 17L12 22L22 17" stroke="#0D99FF" stroke-width="2" stroke-linecap="round"/><path d="M2 12L12 17L22 12" stroke="#0D99FF" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Ligma</span>
        </div>
        <button id="newProjectBtn" class="btn-primary animate-hover">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Новый проект
        </button>
        
        <div class="nav-group">
            <span class="group-title">Недавние</span>
            <ul id="recentList" class="nav-list">
                <li class="skeleton"></li>
                <li class="skeleton"></li>
            </ul>
        </div>

        <div class="nav-group">
            <span class="group-title">Меню</span>
            <ul class="nav-list">
                <li class="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Библиотека
                </li>
            </ul>
        </div>
    </aside>

    <main class="content">
        <header class="top-header">
            <h1 id="greeting" class="fade-in">
                <span class="spinner"></span>
            </h1>
        </header>

        <section class="library-section fade-in-up">
            <h2>Проекты на Рабочем столе</h2>
            <div id="libraryGrid" class="library-grid">
                <div class="card-skeleton"></div>
                <div class="card-skeleton"></div>
                <div class="card-skeleton"></div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-dialog scale-in">
            <h3>Новый проект</h3>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="projectName" placeholder="Мой UI Дизайн" autofocus>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="projectDesc" placeholder="Описание проекта..."></textarea>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="useGit">
                <label for="useGit">Инициализировать Git (<span id="gitStatus">проверка...</span>)</label>
            </div>
            <div class="modal-actions">
                <button id="cancelBtn" class="btn-secondary">Отмена</button>
                <button id="createBtn" class="btn-primary">
                    <span id="createBtnText">Создать</span>
                    <span id="createSpinner" class="spinner hidden"></span>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
